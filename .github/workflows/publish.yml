name: Publish to npm

# Publishes when you create a GitHub Release. The published version is whatever
# is in package.json; the release tag (e.g. v0.0.2) is the trigger + label and
# must match package.json's version (guarded below).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm; Node 22 ships an older one.
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and verify the built artifact
        run: |
          npm run typecheck
          npm test
          npm run verify:build

      - name: Ensure release tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "release tag: $TAG | package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG). Bump package.json and re-tag."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth is via OIDC trusted publishing.
      # prepublishOnly rebuilds dist; provenance is attached automatically.
      - name: Publish to npm
        run: npm publish
