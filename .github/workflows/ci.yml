name: CI

# Runs the full test suite on every pushed commit and on pull requests.
# Mirrors the gate in publish.yml so problems surface long before a release.
on:
  push:
    branches: ['**']
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and verify the built artifact
        run: |
          npm run typecheck
          npm test
          npm run verify:build
